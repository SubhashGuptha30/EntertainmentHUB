<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entertainment Hub | Profile</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/profile.css" />
  <link rel="shortcut icon" href="/static/images/favicon.png" type="image/x-icon" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>

<body>
  <div id="preloader">
    <div class="loader">
      <div class="inner"></div>
    </div>
  </div>

  <div id="main-content">
    <div id="global-header"></div>

    <div class="profile-container">
      <!-- Top Banner (Cover Image) -->
      <div class="profile-banner"></div>

      <div class="profile-layout">
        <!-- Sidebar Navigation -->
        <div class="profile-sidebar clay-card">
          <div class="profile-pic-wrapper">
            <img src="/static/images/user.png" alt="Profile Picture" class="profile-img" id="profile-img" />
            <div class="edit-pic-overlay" onclick="document.getElementById('upload-profile-pic').click()">
              <i class='bx bx-camera'></i>
            </div>
            <input type="file" id="upload-profile-pic" style="display:none" accept="image/*" />
          </div>
          <h2 id="profile-username" class="clay-text">Username</h2>
          
          <div class="profile-tabs">
            <button class="tab-btn active" data-target="overview"><i class='bx bx-user'></i> Overview</button>
            <button class="tab-btn" data-target="edit-profile"><i class='bx bx-edit'></i> Edit Profile</button>
            <button class="tab-btn" data-target="security"><i class='bx bx-shield-quarter'></i> Security</button>
            <button class="tab-btn" data-target="more"><i class='bx bx-dots-horizontal-rounded'></i> More</button>
          </div>
        </div>

        <!-- Main Content Area -->
        <div class="profile-content clay-card">
          
          <!-- Overview Tab -->
          <div id="overview" class="tab-pane active fade-in">
            <h3 class="pane-title">Profile Overview</h3>
            <div class="overview-grid">
              <div class="info-box clay-deboss">
                <i class='bx bx-envelope'></i>
                <div>
                  <span class="info-label">Email</span>
                  <p id="profile-email" class="info-value">user@example.com</p>
                </div>
              </div>
              <div class="info-box clay-deboss">
                <i class='bx bx-male-female'></i>
                <div>
                  <span class="info-label">Gender</span>
                  <p id="profile-gender" class="info-value">Not specified</p>
                </div>
              </div>
              <div class="info-box clay-deboss">
                <i class='bx bx-calendar'></i>
                <div>
                  <span class="info-label">Age</span>
                  <p id="profile-age" class="info-value">Not specified</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Edit Profile Tab -->
          <div id="edit-profile" class="tab-pane fade-in">
            <h3 class="pane-title">Edit Information</h3>
            <form id="edit-profile-form">
              <div class="form-group">
                <label for="edit-username">Username</label>
                <div class="input-icon-wrapper">
                  <i class='bx bx-user'></i>
                  <input type="text" id="edit-username" name="edit-username" class="clay-input" />
                </div>
              </div>
              <div class="form-group">
                <label for="edit-email">Email</label>
                <div class="input-icon-wrapper">
                  <i class='bx bx-envelope'></i>
                  <input type="email" id="edit-email" name="edit-email" class="clay-input" />
                </div>
              </div>
              <div class="form-group">
                <label for="edit-gender">Gender</label>
                <div class="input-icon-wrapper">
                  <i class='bx bx-male-female'></i>
                  <input type="text" id="edit-gender" name="edit-gender" class="clay-input" />
                </div>
              </div>
              <div class="form-group">
                <label for="edit-age">Age</label>
                <div class="input-icon-wrapper">
                  <i class='bx bx-calendar'></i>
                  <input type="number" id="edit-age" name="edit-age" class="clay-input" />
                </div>
              </div>
              <button type="submit" class="clay-btn primary-btn mt-4">Save Changes</button>
            </form>
          </div>

          <!-- Security Tab -->
          <div id="security" class="tab-pane fade-in">
            <h3 class="pane-title">Change Password</h3>
            <form id="change-password-form">
              <div class="form-group">
                <label for="current-password">Current Password</label>
                <div class="input-icon-wrapper">
                  <i class='bx bx-lock-open-alt'></i>
                  <input type="password" id="current-password" name="current-password" class="clay-input" />
                </div>
              </div>
              <div class="form-group">
                <label for="new-password">New Password</label>
                <div class="input-icon-wrapper">
                  <i class='bx bx-lock-alt'></i>
                  <input type="password" id="new-password" name="new-password" class="clay-input" />
                </div>
              </div>
              <div class="form-group">
                <label for="confirm-password">Confirm New Password</label>
                <div class="input-icon-wrapper">
                  <i class='bx bx-check-shield'></i>
                  <input type="password" id="confirm-password" name="confirm-password" class="clay-input" />
                </div>
              </div>
              <button type="submit" class="clay-btn primary-btn mt-4">Update Password</button>
            </form>
          </div>

          <!-- More Options Tab -->
          <div id="more" class="tab-pane fade-in">
            <h3 class="pane-title">More Options</h3>
            <div class="more-options-grid">
              <a href="/contact/contactus" class="clay-btn secondary-btn">
                <i class='bx bx-message-square-dots'></i> Contact Us
              </a>
              <a href="/aboutus" class="clay-btn secondary-btn">
                <i class='bx bx-info-circle'></i> About Us
              </a>
            </div>
            
            <div class="danger-zone clay-deboss mt-4">
              <h4>Danger Zone</h4>
              <p>Logging out will clear your current session.</p>
              <button class="clay-btn danger-btn mt-2" id="logout-button">
                <i class='bx bx-log-out'></i> Logout
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!--Footer-->
  <div id="global-footer"></div>
  <!--Footer-->

  <script src="/static/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      // Preloader
      document.getElementById("preloader").style.display = "block";
      setTimeout(function () {
        document.getElementById("preloader").style.display = "none";
        document.getElementById("main-content").style.display = "block";
      }, 1000);

      // Load user from server session
      await loadUserInfo();

      // Event listeners
      document.getElementById('upload-profile-pic').addEventListener('change', handleProfilePicUpload);
      document.getElementById('edit-profile-form').addEventListener('submit', updateProfile);
      document.getElementById('change-password-form').addEventListener('submit', changePassword);
      document.getElementById('logout-button').addEventListener('click', logout);
    });

    async function loadUserInfo() {
      try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) {
          // Session expired or not logged in — redirect to landing
          localStorage.removeItem('signedIn');
          localStorage.removeItem('currentUser');
          sessionStorage.removeItem('signedIn');
          sessionStorage.removeItem('currentUser');
          window.location.replace('/');
          return;
        }
        const user = await res.json();
        // Keep whichever storage is in use in sync
        const store = localStorage.getItem('signedIn') === 'true' ? localStorage : sessionStorage;
        store.setItem('currentUser', JSON.stringify(user));
        store.setItem('signedIn', 'true');
        populateUI(user);
      } catch {
        const cached = JSON.parse(localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser') || 'null');
        if (cached) populateUI(cached);
      }
    }

    function populateUI(user) {
      document.getElementById('profile-username').textContent = user.username || 'Unknown';
      document.getElementById('edit-username').value = user.username || '';

      document.getElementById('profile-email').textContent = user.email || '—';
      document.getElementById('edit-email').value = user.email || '';

      document.getElementById('profile-gender').textContent = user.gender || 'Not specified';
      document.getElementById('edit-gender').value = user.gender || '';

      document.getElementById('profile-age').textContent = user.age || 'Not specified';
      document.getElementById('edit-age').value = user.age || '';

      if (user.profile_pic || user.profilePic) {
        document.getElementById('profile-img').src = user.profile_pic || user.profilePic;
      }
    }

    // Tab Switching Logic
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        // Remove active class from all buttons and panes
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        
        // Add active class to clicked button
        btn.classList.add('active');
        
        // Show corresponding pane
        const targetId = btn.getAttribute('data-target');
        document.getElementById(targetId).classList.add('active');
      });
    });

    function handleProfilePicUpload() {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = async function (e) {
          document.getElementById('profile-img').src = e.target.result;
          // Save profile pic via API (base64 string)
          await fetch('/api/auth/me', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ profile_pic: e.target.result })
          });
          const cached = JSON.parse(localStorage.getItem('currentUser') || '{}');
          cached.profile_pic = e.target.result;
          localStorage.setItem('currentUser', JSON.stringify(cached));
        };
        reader.readAsDataURL(file);
      }
    }

    async function updateProfile(event) {
      event.preventDefault();
      const body = {
        username: document.getElementById('edit-username').value,
        email: document.getElementById('edit-email').value,
        gender: document.getElementById('edit-gender').value,
        age: parseInt(document.getElementById('edit-age').value),
      };

      const res = await fetch('/api/auth/me', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (res.ok) {
        alert('Profile updated successfully!');
        // Update localStorage too
        const cached = JSON.parse(localStorage.getItem('currentUser') || '{}');
        Object.assign(cached, body);
        localStorage.setItem('currentUser', JSON.stringify(cached));
        location.reload();
      } else {
        const data = await res.json();
        alert('Error: ' + (data.error || 'Update failed'));
      }
    }

    async function changePassword(event) {
      event.preventDefault();
      const currentPassword = document.getElementById('current-password').value;
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword !== confirmPassword) {
        alert('New passwords do not match!');
        return;
      }

      const res = await fetch('/api/auth/me', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_password: currentPassword, new_password: newPassword })
      });

      if (res.ok) {
        alert('Password changed successfully!');
        document.getElementById('current-password').value = '';
        document.getElementById('new-password').value = '';
        document.getElementById('confirm-password').value = '';
        toggleChangePassword();
      } else {
        const data = await res.json();
        alert('Error: ' + (data.error || 'Password change failed'));
      }
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      localStorage.removeItem('currentUser');
      localStorage.removeItem('signedIn');
      sessionStorage.removeItem('currentUser');
      sessionStorage.removeItem('signedIn');
      alert('Logged out successfully!');
      window.location.replace('/');
    }
  </script>
</body>

</html>
