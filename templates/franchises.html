<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entertainment Hub | Franchises</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/franchises.css" />
  <link rel="stylesheet" href="/static/css/swiper-bundle.min.css" />
  <link rel="shortcut icon" href="/static/images/favicon.png" type="image/x-icon" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>

<body>
  <div id="preloader">
    <div class="loader">
      <div class="inner"></div>
    </div>
  </div>

  <div id="main-content">
    <div id="global-header"></div>

    <!-- Franchises Section -->
    <div class="franchises-top container">
      <h1 class="franchises-heading">Franchises</h1>
      <p class="franchises-sub">Every universe and saga, in the right watch order.</p>
      <div class="franchise-filters" role="group" aria-label="Filter franchises">
        <button class="franchise-chip active" data-kind="universe,saga,anime">All</button>
        <button class="franchise-chip" data-kind="universe">Universes</button>
        <button class="franchise-chip" data-kind="saga">Sagas</button>
        <button class="franchise-chip" data-kind="anime">Anime</button>
        <a class="franchise-chip" href="/one-and-done" style="text-decoration:none;">Trilogies &amp; duologies →</a>
      </div>
    </div>
    <section class="franchises-section container">
      <!-- Franchise cards -->
    </section>
    <!-- End of Franchises Section -->

    <!--Footer-->
    <div id="global-footer"></div>
    <!--Footer-->

    <script src="/static/js/main.js"></script>
    <script src="/static/js/franchise.js"></script>
</body>

</html>
